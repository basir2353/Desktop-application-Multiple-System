# Applied after expo prebuild for release APK builds (Windows-friendly).
# Phone installs: arm64 only — cuts ~30MB vs universal (x86/x86_64/armeabi-v7a).
reactNativeArchitectures=arm64-v8a
newArchEnabled=false
hermesEnabled=true

# R8 / resource shrink — smaller DEX + unused res (safe with Expo default keeps).
android.enableProguardInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
android.enablePngCrunchInReleaseBuilds=true

# Skip image format extras we do not use in-app (saves a few hundred KB–MB).
expo.gif.enabled=false
expo.webp.enabled=false
expo.webp.animated=false

# Compress .so inside the APK (smaller download / install size).
expo.useLegacyPackaging=true

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
