# Prefer the standalone backend-desktop service config.
# If this file is used from the monorepo root (Root Directory empty),
# Railway must still build backend-desktop/Dockerfile and start /app/api/...
#
# Recommended Railway UI settings (avoids relying on this root file):
#   Root Directory: backend-desktop
#   Dockerfile path: Dockerfile
#   See backend-desktop/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend-desktop/Dockerfile"

[deploy]
startCommand = "node /app/api/scripts/start-railway.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
